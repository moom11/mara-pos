<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شركة متعب - مبيعات مواد الجبل</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
    <h1 id="bizName">نظام مبيعات مواد الجبل</h1>
    <span class="today" id="today"></span>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <a href="#dashboard" data-page="dashboard">🏠 الرئيسية</a>
      <a href="#sales" data-page="sales">🚚 المبيعات (الردود)</a>
      <a href="#customers" data-page="customers">👥 العملاء والحسابات</a>
      <a href="#payments" data-page="payments">💵 سندات القبض</a>
      <a href="#expenses" data-page="expenses">⛽ المصروفات</a>
      <a href="#materials" data-page="materials">⛰️ المواد والأسعار</a>
      <a href="#trucks" data-page="trucks">🚛 القلابات وكشوفاتها</a>
      <a href="#assets" data-page="assets">🏗️ الأصول والمعدات</a>
      <a href="#reports" data-page="reports">📊 التقارير</a>
      <a href="#settings" data-page="settings">⚙️ الإعدادات والنسخ الاحتياطي</a>
    </nav>
    <main id="app"></main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="submit" class="btn primary" value="save">حفظ</button>
        <button type="button" class="btn" id="modalCancel">إلغاء</button>
      </div>
    </form>
  </dialog>

  <datalist id="truckTypes"></datalist>
  <div id="printArea"></div>
  <div id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>مارا — تسجيل خروج القلابات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
    <div class="brand"><span class="brand-mark">M</span><span id="brandName">مارا</span></div>
    <div class="who" id="who"></div>
  </header>

  <nav class="drawer" id="drawer" hidden></nav>
  <div class="scrim" id="scrim" hidden></div>

  <main id="app"></main>

  <dialog id="modal">
    <form method="dialog" id="modalForm" novalidate>
      <div class="modal-head"><h2 id="modalTitle"></h2><button type="button" class="icon-btn" data-close>✕</button></div>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </form>
  </dialog>

  <datalist id="plateList"></datalist>
  <datalist id="truckTypes"></datalist>
  <div id="printArea"></div>
  <div id="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>

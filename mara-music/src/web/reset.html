<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>حذف النسخة القديمة — مارا ميوزك</title>
<!--
  صفحة مستقلة تمامًا: لا تستعمل app.js ولا style.css ولا أي ملف آخر.
  سببها أن الجوال قد يحتفظ بنسخة قديمة من الواجهة في ذاكرته، والنسخة
  القديمة لا تستطيع إصلاح نفسها. فهذه الصفحة تحذفها من الخارج.

  لا تمسّ شيئًا على جهاز المطعم: لا الأغاني ولا الإعدادات ولا الرموز.
  تحذف فقط ما خزّنه هذا الجوال في متصفّحه.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 20px; background: #0f1115; color: #e8e8ea;
    font: 16px/1.9 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .box { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #9aa0a8; font-size: 14px; margin: 0 0 24px; }
  ol { padding: 0; margin: 0; list-style: none; }
  li {
    padding: 14px 16px; margin-bottom: 10px; border-radius: 14px;
    background: #171a21; border: 1px solid #252932; display: flex; gap: 12px;
  }
  li .mark { width: 22px; flex: none; text-align: center; }
  .done { border-color: #2b5c3f; }
  .fail { border-color: #6b3030; color: #ffb3b3; }
  #result { margin-top: 22px; font-size: 18px; font-weight: 600; }
  a.btn {
    display: block; margin-top: 18px; padding: 16px; border-radius: 14px;
    background: #c9a227; color: #1a1400; text-align: center;
    text-decoration: none; font-weight: 700; font-size: 17px;
  }
  .hint { color: #9aa0a8; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<div class="box">
  <h1>حذف النسخة القديمة</h1>
  <p class="sub">يمسح ما خزّنه هذا الجوال فقط. أغاني المطعم وإعداداته لا تتأثر.</p>
  <ol id="steps"></ol>
  <div id="result"></div>
  <a class="btn" id="open" href="/" hidden>افتح مارا ميوزك</a>
  <p class="hint">بعد الفتح أضف الأيقونة للشاشة الرئيسية من جديد: زر المشاركة ← إضافة إلى الشاشة الرئيسية.</p>
</div>

<script>
'use strict';

const steps = document.getElementById('steps');

function line(text) {
  const li = document.createElement('li');
  const mark = document.createElement('span');
  mark.className = 'mark';
  mark.textContent = '…';
  const label = document.createElement('span');
  label.textContent = text;
  li.appendChild(mark);
  li.appendChild(label);
  steps.appendChild(li);
  return {
    ok(note) {
      li.className = 'done';
      mark.textContent = '✓';
      if (note) label.textContent = `${text} — ${note}`;
    },
    fail(note) {
      li.className = 'fail';
      mark.textContent = '×';
      label.textContent = `${text} — ${note}`;
    }
  };
}

/* كل خطوة على حدة: فشل واحدة لا يمنع البقية */
async function step(text, run) {
  const row = line(text);
  try {
    row.ok(await run());
    return true;
  } catch (err) {
    row.fail(err && err.message ? err.message : 'تعذّر');
    return false;
  }
}

async function run() {
  let allOk = true;

  allOk = await step('إيقاف عامل الخدمة القديم', async () => {
    if (!('serviceWorker' in navigator)) return 'غير مستعمل';
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
    return regs.length ? `أُوقف ${regs.length}` : 'لا يوجد';
  }) && allOk;

  allOk = await step('حذف الملفات المخزّنة', async () => {
    if (!('caches' in window)) return 'غير مستعمل';
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
    return keys.length ? `حُذف ${keys.length}` : 'لا يوجد';
  }) && allOk;

  allOk = await step('مسح بيانات الجلسة', async () => {
    localStorage.clear();
    sessionStorage.clear();
    return 'تم';
  }) && allOk;

  const result = document.getElementById('result');
  if (allOk) {
    result.textContent = 'تم الحذف. افتح مارا من جديد وأدخل الرمز.';
  } else {
    result.textContent = 'لم تكتمل بعض الخطوات. احذف بيانات الموقع من إعدادات المتصفّح.';
  }
  // رقم عشوائي في العنوان: يضمن أن الصفحة تأتي من الخادم لا من ذاكرة المتصفّح
  const open = document.getElementById('open');
  open.href = `/?fresh=${Date.now()}`;
  open.hidden = false;
}

run();
</script>
</body>
</html>
